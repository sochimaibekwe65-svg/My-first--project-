<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA Nursing AI

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0066CC, #00A6A6);
      color:white
    }

    header {
      background: linear-gradient(135deg, #0066cc, #00a6a6);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .tagline {
      margin-top: 8px;
      font-size: 16px;
    }

    nav {
      background: #ffffff;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    nav a {
      color: #0066cc;
      text-decoration: none;
      font-weight: bold;
      margin: 0 10px;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero-icon {
      font-size: 70px;
    }

    h1 {
      color: #0066cc;
      font-size: 40px;
      margin: 15px 0;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.6;
      max-width: 650px;
      margin: auto;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 30px;
      background: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    .section-title {
      text-align: center;
      color: #0066cc;
      margin: 35px 0 20px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .card h3 {
      color: #0066cc;
      margin-bottom: 10px;
    }

    .card p {
      color: #5d7180;
      line-height: 1.5;
    }

    .ask {
      background: #e9f9ff;
      padding: 45px 20px;
      margin-top: 40px;
      text-align: center;
    }

    .ask-box {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 1px solid #c5dce8;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 14px 28px;
      border: none;
      border-radius: 25px;
      background: #00a6a6;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #answer {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #f4fbff;
      border-radius: 10px;
      text-align: left;
      line-height: 1.6;
    }

    .about {
      text-align: center;
      max-width: 750px;
      margin: auto;
      padding: 40px 20px;
      line-height: 1.7;
    }

    footer {
      background: #12324a;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      nav a {
        margin: 0 5px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🩺 NOVA NURS AI</div>
    <div class="tagline">Your Nursing AI Learning Assistant</div>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#nursing">Nursing</a>
    <a href="#ask">Ask NOVA</a>
    <a href="#about">About</a>
  </nav>

  <section class="hero" id="home">

    <div class="hero-icon">👩‍⚕️</div>

    <h1>Welcome to NOVA NURS AI</h1>

    <p>
      Your nursing-focused digital learning assistant.
      Learn, study, practise and explore nursing knowledge
      with NOVA.
    </p>

    <a href="#ask" class="button">Ask NOVA 🤖</a>

  </section>

  <h2 class="section-title" id="nursing">
    Nursing Tools
  </h2>

  <section class="features">

    <div class="card">
      <div class="card-icon">📚</div>
      <h3>Nursing Study</h3>
      <p>
        Study nursing subjects, concepts and procedures.
      </p>
    </div>

    <div class="card">
      <div class="card-icon">💊</div>
      <h3>Medication</h3>
      <p>
        Learn about medicines and nursing considerations.
      </p>
    </div>

    <div class="card">
      <div class="card-icon">🫀</div>
      <h3>Body Systems</h3>
      <p>
        Explore important human body systems.
      </p>
    </div>

    <div class="card">
      <div class="card-icon">🧮</div>
      <h3>Nursing Calculations</h3>
      <p>
        Practise important nursing calculation concepts.
      </p>
    </div>

    <div class="card">
      <div class="card-icon">📝</div>
      <h3>Nursing Quiz</h3>
      <p>
        Test your nursing knowledge with quizzes.
      </p>
    </div>

    <div class="card">
      <div class="card-icon">🏥</div>
      <h3>Patient Care</h3>
      <p>
        Learn fundamental principles of patient care.
      </p>
    </div>

  </section>

  <section class="ask" id="ask">

    <h2 class="section-title">🤖 Ask NOVA</h2>

    <div class="ask-box">

      <p>
        Ask a nursing question below.
      </p>

      <input
        type="text"
        id="question"
        placeholder="Example: What are normal adult vital signs?"
      >

      <button onclick="askNova()">
        Ask NOVA
      </button>

      <div id="answer"></div>

    </div>

  </section>

  <section class="about" id="about">

    <h2 class="section-title">About NOVA</h2>

    <p>
      NOVA NURS AI is a nursing-focused educational platform
      being developed to help nursing students learn,
      revise and practise.
    </p>

  </section>

  <footer>

    <p><strong>🩺 NOVA NURS AI</strong></p>

    <p>Nursing • Learning • Technology</p>

    <p>© 2026 NOVA NURS AI</p>

  </footer>

  <script>

    function askNova() {

      const question =
        document.getElementById("question").value.trim();

      const answer =
        document.getElementById("answer");

      if (question === "") {

        answer.style.display = "block";

        answer.innerHTML =
          "Please type your nursing question first. 🩺";

        return;
      }

      answer.style.display = "block";

      answer.innerHTML =
        "<strong>🤖 NOVA:</strong><br><br>" +
        "You asked: " + question +
        "<br><br>" +
        "NOVA's real AI assistant will be connected " +
        "in the next stage.";

    }

  </script>

</body>
  </html>
